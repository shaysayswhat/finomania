name: Build Windows app

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt "pyinstaller>=6.6" pytest pillow

      - name: Unit and validation tests
        run: python -m pytest -q tests

      - name: Build executables (PyInstaller)
        run: pyinstaller --noconfirm --clean packaging/finomania.spec

      - name: Self-test the frozen application
        env:
          QT_QPA_PLATFORM: offscreen
        run: dist\Finomania\finomania-cli.exe --selftest

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      - name: Build installer and portable zip
        shell: pwsh
        run: |
          $v = (python -c "import finomania; print(finomania.__version__)").Trim()
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$v" packaging\installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Compress-Archive -Path dist\Finomania -DestinationPath "installer\Finomania-$v-portable-win64.zip"
          Get-ChildItem installer | Format-Table Name, Length

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Finomania-Windows
          path: installer/*
          retention-days: 30

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: installer/*
          generate_release_notes: true
