[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "finomania"
version = "1.0.0"
description = "Open-source EViews-style econometrics workbench for financial time series and panel data"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["econometrics", "garch", "dcc", "panel data", "fama-french", "lstm", "time series", "eviews"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Financial and Insurance Industry",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Office/Business :: Financial",
]
dependencies = [
    "numpy>=1.26", "pandas>=2.2", "scipy>=1.11", "statsmodels>=0.14.2", "arch>=7.0", "linearmodels>=6.0",
    "scikit-learn>=1.3", "matplotlib>=3.8", "PySide6>=6.6", "openpyxl>=3.1",
]

[project.optional-dependencies]
deep = ["torch"]
web = ["yfinance"]
dev = ["pytest"]

[project.scripts]
finomania-cli = "finomania.__main__:cli_main"

[project.gui-scripts]
finomania = "finomania.__main__:main"

[tool.setuptools.packages.find]
include = ["finomania*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::RuntimeWarning"]
